{% for item in photos %}
<button type="button"
        class="js-photo relative rounded-2xl overflow-hidden glass-panel border border-white/10 group cursor-pointer aspect-square text-left"
        data-kind="{{ item.is_video|yesno:'video,image' }}"
        data-media="{{ item.media_url }}"
        data-title="{{ item.title }}"
        data-author="{{ item.author }}"
        data-likes="{{ item.likes }}"
        data-liked="{{ item.is_liked|yesno:'1,0' }}"
        data-like-url="{% url 'festival:toggle_like' item.id %}">
    {% if item.is_video %}
    <video src="{{ item.media_url }}" class="w-full h-full object-cover" muted playsinline preload="metadata"></video>
    <span class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-black/70 text-white text-[10px] flex items-center justify-center">
        <i class="fa-solid fa-play"></i>
    </span>
    {% else %}
    <img src="{{ item.display_image }}" alt="{{ item.title }}"
         class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
    {% endif %}

    <span class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent p-2.5 flex flex-col justify-end">
        <span class="text-xs font-bold text-white truncate">{{ item.title }}</span>
        <span class="flex justify-between items-center text-[10px] text-gray-300">
            <span>by {{ item.author }}</span>
            <span class="{% if item.is_liked %}text-fest-accent{% else %}text-gray-300{% endif %} font-bold">
                <i class="fa-{% if item.is_liked %}solid{% else %}regular{% endif %} fa-heart mr-0.5"></i>{{ item.likes }}
            </span>
        </span>
    </span>
</button>
{% empty %}
<div class="col-span-2 text-center py-10 text-gray-500 text-xs space-y-2">
    <i class="fa-regular fa-image text-2xl block"></i>
    <p>Nothing here yet in this category.</p>
</div>
{% endfor %}
