{% for photo in photos %}
<button type="button"
        class="js-photo relative rounded-2xl overflow-hidden glass-panel border border-white/10 group cursor-pointer aspect-square text-left"
        data-image="{{ photo.display_image }}"
        data-title="{{ photo.title }}"
        data-author="{{ photo.author }}"
        data-likes="{{ photo.likes }}"
        data-liked="{{ photo.is_liked|yesno:'1,0' }}"
        data-like-url="{% url 'festival:toggle_like' photo.id %}">
    <img src="{{ photo.display_image }}" alt="{{ photo.title }}"
         class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
    <span class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent p-2.5 flex flex-col justify-end">
        <span class="text-xs font-bold text-white truncate">{{ photo.title }}</span>
        <span class="flex justify-between items-center text-[10px] text-gray-300">
            <span>by {{ photo.author }}</span>
            <span class="{% if photo.is_liked %}text-fest-accent{% else %}text-gray-300{% endif %} font-bold">
                <i class="fa-{% if photo.is_liked %}solid{% else %}regular{% endif %} fa-heart mr-0.5"></i>{{ photo.likes }}
            </span>
        </span>
    </span>
</button>
{% empty %}
<div class="col-span-2 text-center py-10 text-gray-500 text-xs space-y-2">
    <i class="fa-regular fa-image text-2xl block"></i>
    <p>No approved photos in this category yet.</p>
</div>
{% endfor %}
