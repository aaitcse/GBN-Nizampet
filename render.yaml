# Render Blueprint - https://render.com/docs/blueprint-spec
# In Render: New > Blueprint, point it at this repo, and it creates both the
# web service and the Postgres database with everything wired together.
databases:
  - name: gbn-db
    databaseName: gbn
    user: gbn
    plan: free # free Postgres is removed after 30 days; upgrade for a real event
    # MUST match the web service region below. Render's internal database
    # hostnames only resolve inside one region, and the default is oregon.
    region: singapore

services:
  - type: web
    name: gbn-festival
    runtime: python
    plan: free # free instances sleep after 15 min idle and wake on the next request
    region: singapore # closest to India; also: oregon, frankfurt, ohio, virginia
    buildCommand: "./build.sh"
    # Migrations run at startup, not during the build: the build environment
    # cannot reach the private database network, the running service can.
    startCommand: "./start.sh"
    # Checks the database and that migrations ran, so a bad deploy reports the
    # reason in the log instead of serving a blank 500.
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: gbn-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates a strong key on first deploy
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      - key: FEST_BRAND
        value: GBN
      - key: FEST_BRAND_FULL
        value: GBN Connect
      - key: WEB_CONCURRENCY
        value: "4"
      # Organiser login, created/updated on every deploy by build.sh.
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false # set this yourself in the Render dashboard
      # Set to 1 for one deploy if you want the demo events/photos/polls loaded.
      - key: SEED_DEMO_DATA
        value: "0"
